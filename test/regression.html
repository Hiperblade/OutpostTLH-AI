<script type="module">
import { TerrainMap } from "../script/TerrainMap.js";
import { Typology, TerrainLayer, PipeType, RobotTypes, StaffPriority } from "../script/Enums.js";
import { Turn, OutcomePhase, GameOutcome, RobotWearPhase } from "../script/Turn.js";
import { Revival } from "../script/Revival.js";
import { createWorkers, createClones, Generation } from "../script/Generations.js";
import { RecipeLib } from "../script/RecipeLib.js";
import { Cure } from "../script/Cure.js";
import { IllnessPhase } from "../script/TurnPopulation.js";
import { BuildingGraph } from "../script/PipeNetwork.js";
import { Placement } from "../script/Placement.js";
import { PrototypeLib } from "../script/PrototypeLib.js";
import { Site, createGame, MAP_SIZE } from "../script/GameSetup.js";
import { SiteTerrain } from "../script/SiteTerrain.js";
import { PlanetTypes } from "../script/DataPlanets.js";
import "../script/DataPrototype.js";
import "../script/DataRecipe.js";
import "../script/DataText_it.js";

function advance(map)
{
	return Turn.advance(map);
}

function snapshot(map)
{
	let st = map.getState();
	let structures = map.getStructure()
		.filter(s => s.getType() != "resource")
		.map(s => [s.getBuildingType(), s.getLayer(), s.getPosition().x, s.getPosition().y, s.getProgressState(), s.getIntegrity(), s.getFrozen()].join(","))
		.sort();
	let materials = {};
	st.getMaterials().slice().sort().forEach(m => { materials[m] = [st.getStored(m), st.getCapacity(m)]; });
	let graphs = map.getGraph().map(g => BuildingGraph.countAll(g) + (BuildingGraph.hasHeadquarter(g) ? "H" : "o")).sort();
	let pop = st.getPopulation();
	let population = { people: pop.registry.reduce((n, g) => n + g.getPopulation(), 0), subsistence: pop.subsistence, wellness: pop.wellness, happiness: pop.happiness };
	return { date: st.getDate(), structures, materials, graphs, population, technology: st.getTechnology().slice().sort() };
}

function scenario()
{
	let log = [];
	let map = new TerrainMap(Typology.Vulcanic, { x: 40, y: 40 });
	let st = map.getState();
	["mediKit","goods","toxicWaste","fusionWaste"].forEach(m => st.configureMaterial(m, "genericStorage"));
	["dozer","digger","miner","roboWorker","MicrowaveSatellite"].forEach(m => st.configureMaterial(m, "roboticStorage"));
	["radioactiveBar","radioactiveWaste"].forEach(m => st.configureMaterial(m, "radioactiveStorage"));
	st.addKnowledge({ technology: ["LandingModule"], discovery: ["Robotics"], theory: ["Find_Metal"] });

	map.addResource("Metal", { x: 8, y: 12 });
	map.addResource("Mineral", { x: 12, y: 20 });

	map.addBuilding("LandingModule", { x: 10, y: 10 });
	Turn.project(map);
	for(let t = 0; t < 6; t++) advance(map);
	log.push(snapshot(map));

	// rete principale
	[[9,12],[9,13],[9,14],[9,16],[9,17]].forEach(p => map.addBuilding("Pipe_nesw_surface", { x: p[0], y: p[1] }));
	map.addBuilding("Pipe_d_surface", { x: 9, y: 15 });
	map.addBuilding("Agridome", { x: 10, y: 13 });
	map.addBuilding("MicrowavePlant", { x: 8, y: 13 });
	map.addBuilding("MineMetal", { x: 8, y: 12 });
	map.addBuilding("Tokamak", { x: 10, y: 14 });
	map.addBuilding("Park", { x: 10, y: 17 });
	map.addBuilding("SpacePort", { x: 12, y: 18 });
	map.addBuilding("Pipe_nesw_underground", { x: 9, y: 16 });
	map.addBuilding("Residential", { x: 10, y: 16 });
	map.addBuilding("MineMineral", { x: 12, y: 20 });
	// seconda rete con headquarter e rete orfana
	map.addBuilding("CommandCenter", { x: 30, y: 31 });
	map.addBuilding("Pipe_ew_surface", { x: 30, y: 30 });
	map.addBuilding("Agridome", { x: 31, y: 30 });
	map.addBuilding("Pipe_nesw_surface", { x: 20, y: 30 });
	map.addBuilding("Pipe_ns_surface", { x: 21, y: 30 });
	map.addBuilding("Agridome", { x: 25, y: 25 });
	// edifici al bordo (devono essere rifiutati senza eccezioni)
	log.push({ edgeLanding: map.addBuilding("LandingModule", { x: 39, y: 20 }) === null, edgePark: map.addBuilding("Park", { x: 39, y: 5 }) === null });

	for(let t = 0; t < 30; t++)
	{
		advance(map);
		if(t % 10 == 9) log.push(snapshot(map));
	}
	return log;
}

// verifiche esplicite su Placement, strutture composite e reti
function checks()
{
	let failures = [];
	let expect = function(name, actual, expected)
	{
		if(JSON.stringify(actual) !== JSON.stringify(expected))
		{
			failures.push(name + ": atteso " + JSON.stringify(expected) + ", ottenuto " + JSON.stringify(actual));
		}
	};
	let reason = function(r) { return r.ok ? "ok" : r.reason; };
	let raze = function(map, p, layer) { while(map.isRazable(p, layer)) map.raze(p, layer); };

	let map = new TerrainMap(Typology.Vulcanic, { x: 40, y: 40 });
	let st = map.getState();
	st.addKnowledge({ technology: ["LandingModule"] });
	map.addResource("Metal", { x: 20, y: 20 });

	// edifici
	expect("agridome su terreno non spianato", reason(Placement.check(map, { buildingType: "Agridome" }, { x: 5, y: 30 })), "notApplicable");
	raze(map, { x: 20, y: 20 });
	expect("agridome su risorsa", reason(Placement.check(map, { buildingType: "Agridome" }, { x: 20, y: 20 })), "noResourceRequired");
	raze(map, { x: 5, y: 30 });
	expect("miniera senza risorsa", reason(Placement.check(map, { buildingType: "MineMetal" }, { x: 5, y: 30 })), "requiresResource");
	expect("landing su terreno grezzo", reason(Placement.place(map, { buildingType: "LandingModule" }, { x: 10, y: 10 })), "ok");
	expect("cella occupata", reason(Placement.check(map, { buildingType: "Agridome" }, { x: 10, y: 10 })), "occupied");
	expect("landing al bordo", map.canPlaceBuilding("LandingModule", { x: 39, y: 20 }), false);
	expect("park al bordo", map.canPlaceBuilding("Park", { x: 39, y: 5 }), false);

	// robot
	expect("dozer non disponibile", reason(Placement.check(map, { isRobot: true, robotType: RobotTypes.Dozer }, { x: 6, y: 30 })), "noDozer");
	expect("miner senza tecnologia", reason(Placement.check(map, { isRobot: true, robotType: RobotTypes.Miner }, { x: 20, y: 20 })), "noExtractionTechnology");
	st.addKnowledge({ theory: ["Extraction_Metal"] });
	expect("miner non disponibile", reason(Placement.check(map, { isRobot: true, robotType: RobotTypes.Miner }, { x: 20, y: 20 })), "noMiner");
	st.createMaterials({ miner: 1 });
	expect("miner", reason(Placement.place(map, { isRobot: true, robotType: RobotTypes.Miner }, { x: 20, y: 20 })), "ok");
	expect("miner consumato", st.getRoboMinerAvailable(), 0);
	let mine = map.findBuilding({ x: 20, y: 20 });
	expect("miniera con pozzo", [mine.getBuildingType(), mine.getParts().map(p => p.getBuildingType() + "@" + p.getLayer())], ["MineMetal", ["Mine@underground"]]);
	expect("pozzo rimanda alla miniera", map.findBuilding({ x: 20, y: 20 }, TerrainLayer.Underground).getMainBuilding() === mine, true);

	// tokamak bloccato da un edificio sotterraneo
	raze(map, { x: 25, y: 25 });
	map.addBuilding("Residential", { x: 25, y: 25 });
	expect("tokamak bloccato", reason(Placement.check(map, { buildingType: "Tokamak" }, { x: 25, y: 25 })), "blocked");

	// distruzione a cascata: demolire una parte del parco distrugge tutto il parco
	let park = map.addBuilding("Park", { x: 30, y: 30 });
	map.onBuildingDestroyed(map.findBuilding({ x: 31, y: 29 }, TerrainLayer.Deep));
	expect("parco distrutto", [park.isDestroyed()].concat(park.getParts().map(p => p.isDestroyed())), [true, true, true, true]);

	// completamento: le parti su altri layer vengono completate
	let tokamak = map.addBuilding("Tokamak", { x: 15, y: 25 });
	map.onBuildingCompleted(tokamak);
	expect("reattore completato", tokamak.getParts()[0].underConstruction(), false);

	// reti: due tubi a U collegati in un solo grafo con l'headquarter
	let net = new TerrainMap(Typology.Vulcanic, { x: 20, y: 20 });
	net.addBuilding("CommandCenter", { x: 5, y: 5 }, true);
	[[6,5],[7,5],[7,6],[7,7],[6,7],[5,7]].forEach(p => net.addPipe(PipeType.NorthEastSouthWest, TerrainLayer.Surface, { x: p[0], y: p[1] }, true));
	net.addBuilding("Agridome", { x: 4, y: 7 }, true);
	net.addPipe(PipeType.NorthEastSouthWest, TerrainLayer.Surface, { x: 15, y: 15 }, true);
	expect("reti", net.getGraph().map(g => BuildingGraph.countAll(g) + (BuildingGraph.hasHeadquarter(g) ? "H" : "o")), ["8H", "1o"]);

	// smaltimento degli scarti
	let plant = new TerrainMap(Typology.Vulcanic, { x: 20, y: 20 });
	plant.addBuilding("CommandCenter", { x: 5, y: 5 }, true);
	plant.addBuilding("MicrowavePlant", { x: 6, y: 5 }, true);
	plant.addBuilding("WasteTreatment", { x: 4, y: 5 }, true);
	plant.getState().createMaterials({ fusionWaste: 25, toxicWaste: 3 });
	Turn.advance(plant);
	expect("smaltimento", [plant.getState().getStored("fusionWaste"), plant.getState().getStored("toxicWaste")], [15, 0]);

	// fase di preparazione: kit con capsule, centro di ricerca automatico senza personale, laboratorio fermo
	let game = new TerrainMap(Typology.Vulcanic, { x: 30, y: 30 });
	let gs = game.getState();
	// magazzini condivisi come in una partita vera (GameSetup.createGame)
	["mediKit", "goods", "toxicWaste", "fusionWaste"].forEach(m => gs.configureMaterial(m, "genericStorage"));
	["dozer", "digger", "miner", "roboWorker", "MicrowaveSatellite"].forEach(m => gs.configureMaterial(m, "roboticStorage"));
	gs.addKnowledge({ technology: ["LandingModule"] });
	game.addBuilding("LandingModule", { x: 10, y: 10 });
	for(let t = 0; t < 4; t++) Turn.advance(game);
	expect("kit: niente capsule, niente cibo, nessun colono", [gs.getStored("cryoCapsule"), gs.getStored("foodUnit"), gs.getPopulation().registry.length], [0, 0, 0]);
	game.addBuilding("EnvironmentalControl", { x: 8, y: 10 }, true);
	game.addBuilding("AutoLab", { x: 12, y: 9 }, true);
	game.addBuilding("HotLab", { x: 10, y: 8 }, true);
	// studi in coda per il centro automatico (Medicina) e per il laboratorio di superficie (Fisica)
	gs.getResearchQueue().push(RecipeLib.create("Medicine"), RecipeLib.create("Physics"));
	game.addBuilding("Pipe_d_surface", { x: 9, y: 12 }, true);
	Turn.project(game);
	expect("risveglio senza centro criogenico", [Revival.check(game).reason, Revival.check(game).detail.status], ["noCryoCenter", "missing"]);
	game.addBuilding("CryoCenter", { x: 9, y: 13 }, true);
	game.addBuilding("Residential", { x: 10, y: 12 }, true);
	for(let t = 0; t < 4; t++) Turn.advance(game);
	let active = type => (gs.getActiveList()[type] || []).length;
	expect("edifici automatici attivi, laboratorio senza personale fermo", [active("AutoLab"), active("CryoCenter"), active("HotLab")], [1, 1, 0]);
	expect("senza minerali nessuna capsula", [gs.getStored("cryoCapsule"), Revival.check(game).reason], [0, "noCapsules"]);
	gs.createMaterials({ mineralOre: 200 });
	Turn.advance(game);
	expect("capsula preparata con 5 minerali", [gs.getStored("cryoCapsule"), gs.getStored("mineralOre")], [1, 195]);
	for(let t = 0; t < 15; t++) Turn.advance(game);
	expect("capsule fino alla capienza del centro", [gs.getStored("cryoCapsule"), gs.getStored("mineralOre")], [10, 150]);
	gs.createMaterials({ foodUnit: 100 });
	Turn.project(game);
	expect("risveglio prenotato", Revival.request(game).ok, true);
	Turn.advance(game);
	let awake = () => gs.getPopulation().registry.reduce((n, g) => n + g.getPopulation(), 0);
	expect("risveglio: 5 cloni svegli, 5 capsule", [awake(), gs.getStored("cryoCapsule"), gs.getPendingRevival()], [5, 5, 0]);
	expect("i risvegliati sono cloni", gs.getPopulation().registry.map(g => [g.isClone(), g.getState(gs.getDate())]), [[true, "clones"]]);
	expect("manodopera separata", [gs.getStored("roboLabor") >= 0, gs.getStored("workerLabor") > 0], [true, true]);

	// punti lavoro: robot 2, clone 1 (senza effetto della felicità)
	Turn.project(game);
	expect("punti lavoro di robot e cloni", [gs.getStored("roboLabor"), gs.getStored("workerLabor")], [gs.getStored("roboWorker") * 4, 5]);
	// il laboratorio (personale 5 = 20 punti) con 5 cloni funziona a un quarto
	let hotLab = gs.getActiveList()["HotLab"] || [];
	expect("laboratorio con i cloni: attivo a un quarto", [hotLab.length, hotLab.length ? gs.getBuildingIssue(hotLab[0]) : null], [1, { reason: "understaffed", missing: [], ratio: 0.25 }]);
	expect("laboratorio con i cloni: ricerca ridotta", gs.getProduced("researchStructureSurface"), 3);
	// precedenza del personale: il secondo laboratorio con precedenza Alta prende i cloni
	let firstLab = hotLab[0];
	let power = game.addBuilding("SupportModule", { x: 14, y: 11 }, true); // energia per il secondo laboratorio
	let secondLab = game.addBuilding("HotLab", { x: 14, y: 9 }, true);
	Turn.project(game);
	let labs = () => [(gs.getActiveList()["HotLab"] || []).indexOf(firstLab) >= 0, (gs.getActiveList()["HotLab"] || []).indexOf(secondLab) >= 0];
	expect("precedenza normale: un solo laboratorio attivo", labs().filter(x => x).length, 1);
	secondLab.setStaffPriority(StaffPriority.High);
	Turn.project(game);
	expect("precedenza alta: il personale va al secondo laboratorio", labs(), [false, true]);
	expect("laboratorio senza personale: manca la manodopera", firstLab && gs.getBuildingIssue(firstLab) && gs.getBuildingIssue(firstLab).missing[0], "workerLabor");
	let savedLab = TerrainMap.fromData(JSON.parse(JSON.stringify(game.toData()))).findBuilding({ x: 14, y: 9 });
	expect("precedenza salvata", savedLab.getStaffPriority(), StaffPriority.High);
	game.delBuilding({ x: 14, y: 9 });
	game.delBuilding({ x: 14, y: 11 });
	Turn.project(game);
	// senza studi in coda il laboratorio resta a riposo e libera il personale
	let queued = gs.getResearchQueue().splice(0);
	Turn.project(game);
	expect("laboratorio a riposo senza studi", [gs.getBuildingIssue(firstLab), (gs.getActiveList()["HotLab"] || []).length, gs.getRemainder("workerLabor")], [{ reason: "idle", missing: [] }, 0, 5]);
	gs.getResearchQueue().push(...queued);
	Turn.project(game);

	// i robot prodotti vengono consegnati: il modulo cargo dà posto al kit e ai primi robot
	game.addBuilding("IndustrialFactory", { x: 8, y: 11 }, true);
	game.addBuilding("MicrowavePlant", { x: 11, y: 8 }, true);
	gs.createMaterials({ metalOre: 20 });
	gs.getProductionQueue().push(RecipeLib.create("Robo-Dozer"));
	let dozers = gs.getStored("dozer");
	for(let t = 0; t < 3; t++) Turn.advance(game);
	expect("robot prodotto consegnato", [gs.getStored("dozer"), gs.getProductionQueue().length], [dozers + 1, 0]);

	// usura per singolo robot: ogni RoboWorker ha la sua durata; quelli a fine vita vanno fuori uso
	let fleet = RobotWearPhase.sync(gs, "roboWorker");
	expect("usura: un elenco per robot", fleet.length, gs.getStored("roboWorker"));
	expect("usura: durate diverse tra robot", new Set(fleet.map(r => r.life)).size > 1, true);
	expect("usura media tra 0 e 1", RobotWearPhase.averageWear(gs, "roboWorker") >= 0 && RobotWearPhase.averageWear(gs, "roboWorker") < 1, true);
	fleet[0].wear = fleet[0].life;
	fleet[1].wear = fleet[1].life;
	game.addBuilding("Pipe_nesw_surface", { x: 9, y: 14 });
	let robots = gs.getStored("roboWorker");
	Turn.advance(game);
	expect("usura: due robot fuori uso", gs.getStored("roboWorker"), robots - 2);

	// punti lavoro: Lavoratore 4, Pensionato 2, ridotti dalla felicità; i cloni 1 a testa
	let clonesNow = gs.getPopulation().registry.filter(g => g.isClone()).reduce((n, g) => n + g.getPopulation(), 0);
	let retirees = new Generation(gs.getDate() - 90, 2, 18);
	let workers = createWorkers(gs.getDate(), 1);
	gs.getPopulation().registry.push(retirees, workers);
	Turn.project(game);
	let factor = 0.5 + 0.5 * gs.getPopulation().happiness;
	expect("punti lavoro di Lavoratori, Pensionati e cloni", gs.getStored("workerLabor"), Math.floor((5 * 4 + 10 * 2) * factor) + clonesNow);
	gs.getPopulation().registry.splice(gs.getPopulation().registry.indexOf(retirees), 2);

	// vittoria (soglie ridotte per il test): coloni contenti per 3 turni
	let limits = [OutcomePhase.VICTORY_POPULATION, OutcomePhase.VICTORY_TURNS, OutcomePhase.VICTORY_HAPPINESS];
	OutcomePhase.VICTORY_POPULATION = 5;
	OutcomePhase.VICTORY_TURNS = 3;
	OutcomePhase.VICTORY_HAPPINESS = 0;
	gs.createMaterials({ foodUnit: 200 });
	for(let t = 0; t < 4; t++) Turn.advance(game);
	expect("i cloni non contano per la vittoria", [gs.getOutcome(), gs.getVictoryStreak()], [null, 0]);
	gs.getPopulation().registry.push(createWorkers(gs.getDate(), 1));
	let illnessRate = IllnessPhase.ILLNESS_RATE;
	IllnessPhase.ILLNESS_RATE = 0; // la malattia ha le sue verifiche: qui contano solo le soglie di vittoria
	let turns = 0;
	while(gs.getOutcome() == null && turns < 30) { Turn.advance(game); turns++; }
	expect("vittoria", gs.getOutcome(), GameOutcome.Victory);
	let dateAtEnd = gs.getDate();
	Turn.advance(game);
	expect("partita conclusa: il tempo non avanza", gs.getDate(), dateAtEnd);
	[OutcomePhase.VICTORY_POPULATION, OutcomePhase.VICTORY_TURNS, OutcomePhase.VICTORY_HAPPINESS] = limits;
	IllnessPhase.ILLNESS_RATE = illnessRate;

	// salvataggio: andata e ritorno identici, anche dopo un turno
	let copy = TerrainMap.fromData(JSON.parse(JSON.stringify(game.toData())));
	expect("salvataggio: stato ricaricato", JSON.stringify(snapshot(copy)), JSON.stringify(snapshot(game)));
	expect("salvataggio: coda e popolazione", JSON.stringify(copy.getState().toData()), JSON.stringify(game.getState().toData()));
	let saved = new TerrainMap(Typology.Vulcanic, { x: 30, y: 30 });
	saved.getState().addKnowledge({ technology: ["LandingModule"] });
	saved.addBuilding("LandingModule", { x: 10, y: 10 });
	saved.addBuilding("Park", { x: 20, y: 20 });
	for(let t = 0; t < 5; t++) Turn.advance(saved);
	let restored = TerrainMap.fromData(JSON.parse(JSON.stringify(saved.toData())));
	expect("salvataggio: parti composite", restored.findBuilding({ x: 21, y: 19 }, TerrainLayer.Deep).getMainBuilding().getBuildingType(), "Park");
	let rnd = Math.random;
	Math.random = () => 0.5; Turn.advance(saved);
	Math.random = () => 0.5; Turn.advance(restored);
	Math.random = rnd;
	expect("salvataggio: turno successivo identico", JSON.stringify(snapshot(restored)), JSON.stringify(snapshot(saved)));

	// creazione della partita
	let site = new Site("ceres", "2");
	let created = createGame(site);
	let morphology = site.getMorphology();
	let names = { 1: "clear", 2: "rough", 4: "impervious", 8: "inaccessible" };
	expect("sito: superficie dal terreno del sito", [5, 77, 140].every(x => [3, 150, 299].every(y =>
		created.findResource({ x: x, y: y }) != null ||
		created.getTerrainImageId(x, y) == "Terrain_asteroid_surface_" + names[morphology[x][y]])), true);
	let counts = {}; morphology.forEach(row => row.forEach(v => { counts[v] = (counts[v] || 0) + 1; }));
	expect("sito: quattro morfologie", Object.keys(counts).sort(), ["1", "2", "4", "8"]);
	let deposits = created.getStructure().filter(el => el.getType() == "resource").length;
	let expected = Object.values(PlanetTypes[site.getTypology()].resources).reduce((a, b) => a + b, 0);
	expect("sito: giacimenti del tipo di pianeta", deposits <= expected && deposits > expected * 0.8, true);
	expect("sito: sfondo 300x150", [site.getBackground().width, site.getBackground().height], [300, 150]);
	expect("sito: salvataggio", Site.fromData(site.toData()).getName(), site.getName());
	expect("sito: non più nel catalogo", Site.fromData({ planetId: "nessuno", siteId: "1" }), null);
	let painted = document.createElement("canvas"); painted.width = 300; painted.height = 150;
	let pctx = painted.getContext("2d");
	pctx.fillStyle = "rgb(0,160,0)"; pctx.fillRect(0, 0, 150, 150);
	pctx.fillStyle = "rgb(140,0,0)"; pctx.fillRect(150, 0, 150, 75);
	pctx.fillStyle = "rgb(0,0,0)"; pctx.fillRect(150, 75, 150, 75);
	let read = SiteTerrain.fromImage(painted, MAP_SIZE);
	expect("mappa del terreno letta dall'immagine", [read[10][20], read[140][200], read[10][200]], [1, 4, 8]);

	let lost = new TerrainMap(Typology.Vulcanic, { x: 30, y: 30 });
	lost.getState().addKnowledge({ technology: ["LandingModule"] });
	lost.addBuilding("LandingModule", { x: 10, y: 10 });
	for(let t = 0; t < 4; t++) Turn.advance(lost);
	expect("ancora in gioco", lost.getState().getOutcome(), null);
	lost.getStructure().filter(el => el.getType() == "building" && el.isHeadquarter()).forEach(el => el.destroy());
	Turn.advance(lost);
	expect("sconfitta senza headquarter", lost.getState().getOutcome(), GameOutcome.Defeat);

	// spiegazione del rifiuto: alloggi fermi per mancanza di habitat residenziale, centro criogenico senza energia
	let housing = new TerrainMap(Typology.Vulcanic, { x: 30, y: 30 });
	let hs = housing.getState();
	hs.addKnowledge({ technology: ["LandingModule"] });
	housing.addBuilding("LandingModule", { x: 10, y: 10 });
	for(let t = 0; t < 4; t++) Turn.advance(housing);
	hs.createMaterials({ cryoCapsule: 20, foodUnit: 100 });
	housing.addBuilding("Pipe_d_surface", { x: 9, y: 12 }, true);
	for(let py = 13; py <= 17; py++) housing.addPipe(PipeType.NorthEastSouthWest, TerrainLayer.Underground, { x: 9, y: py }, true);
	[[10, 13], [10, 15], [10, 17], [8, 13], [8, 15], [8, 17]].forEach(p => housing.addBuilding("Residential", { x: p[0], y: p[1] }, true));
	housing.addBuilding("CryoCenter", { x: 8, y: 14 }, true);
	for(let t = 0; t < 4; t++) Turn.advance(housing);
	let refused = Revival.check(housing);
	let residential = housing.findBuilding({ x: 10, y: 13 }, TerrainLayer.Underground);
	expect("indicatore: struttura residenziale ferma", hs.getBuildingIssue(residential), { reason: "inactive", missing: ["habitatResidentialUnit"], noSpace: false });
	expect("abitabilità nel report", [hs.getHabitability().capsules, hs.getHabitability().housing], [20, { available: 0, needed: 0 }]);
	expect("alloggi fermi: manca habitat residenziale", [refused.reason, refused.detail.building, refused.detail.status, refused.detail.missing], ["notEnoughHousing", "Residential", "inactive", ["habitatResidentialUnit"]]);
	housing.addBuilding("EnvironmentalControl", { x: 8, y: 10 }, true);
	Turn.advance(housing);
	refused = Revival.check(housing);
	expect("centro criogenico senza energia", [refused.reason, refused.detail.status, refused.detail.missing], ["noCryoCenter", "inactive", ["power"]]);

	// le parti di una struttura composita non consumano manodopera: costruisce l'edificio principale
	let parts = new TerrainMap(Typology.Vulcanic, { x: 30, y: 30 });
	parts.getState().addKnowledge({ technology: ["LandingModule"] });
	parts.addBuilding("LandingModule", { x: 10, y: 10 });
	for(let t = 0; t < 4; t++) Turn.advance(parts);
	parts.addBuilding("Park", { x: 12, y: 13 });
	Turn.project(parts);
	let parkIssues = parts.getState().getBuildingIssues().filter(e => e.building.getBuildingType().indexOf("Park") == 0);
	expect("parco scollegato segnalato una volta sola", parkIssues.map(e => e.building.getBuildingType() + ":" + e.issue.reason), ["Park:disconnected"]);

	// un cantiere riceve al massimo 4 punti a turno; i tempi sono in punti (turni di un colono x 4)
	let works = new TerrainMap(Typology.Vulcanic, { x: 30, y: 30 });
	works.getState().addKnowledge({ technology: ["LandingModule"] });
	works.addBuilding("LandingModule", { x: 10, y: 10 });
	for(let t = 0; t < 4; t++) Turn.advance(works);
	let control = works.addBuilding("EnvironmentalControl", { x: 8, y: 10 });
	let start = control.getProgressState();
	Turn.advance(works);
	expect("cantiere: tempo in punti e 4 punti a turno", [start, control.getProgressState()], [-20, -16]);

	// i cantieri pagano dopo la produzione: le barre di ferro della Fonderia servono già nello stesso turno
	let foundry = new TerrainMap(Typology.Vulcanic, { x: 30, y: 30 });
	let fs = foundry.getState();
	fs.addKnowledge({ technology: ["LandingModule"] });
	foundry.addBuilding("LandingModule", { x: 10, y: 10 });
	for(let t = 0; t < 4; t++) Turn.advance(foundry);
	foundry.addBuilding("Smelter", { x: 8, y: 10 }, true);
	fs.createMaterials({ metalOre: 100 });
	let advanced = [foundry.addBuilding("AgridomeAdv", { x: 12, y: 9 }), foundry.addBuilding("AgridomeAdv", { x: 8, y: 11 })];
	let before = advanced.map(b => b.getProgressState());
	Turn.advance(foundry);
	expect("cantieri con le barre della fonderia", advanced.map((b, i) => b.getProgressState() - before[i]), [4, 4]);

	// chi produce lavora prima di chi consuma: la Struttura Medica usa le unità farmaceutiche dello stesso turno
	let pharma = new TerrainMap(Typology.Vulcanic, { x: 30, y: 30 });
	let ps = pharma.getState();
	ps.addKnowledge({ technology: ["LandingModule"] });
	ps.createMaterials({ foodUnit: 500, residentialUnit: 500, habitatUnit: 500 });
	pharma.addBuilding("LandingModule", { x: 10, y: 10 });
	for(let t = 0; t < 4; t++) Turn.advance(pharma);
	ps.getPopulation().registry.push(createWorkers(ps.getDate(), 4));
	ps.createMaterials({ mineralOre: 100, cristalOre: 100 });
	pharma.addBuilding("PharmaceuticalIndustry", { x: 12, y: 9 }, true);
	pharma.addBuilding("MedicalStructure", { x: 9, y: 13 }, true);
	Turn.project(pharma);
	expect("filiera medica nello stesso turno", [(ps.getActiveList()["PharmaceuticalIndustry"] || []).length, (ps.getActiveList()["MedicalStructure"] || []).length], [1, 1]);

	// scorta interna dei semilavorati: 10 barre per Fonderia, +5 per Deposito, anche con gli edifici fermi
	let stock = new TerrainMap(Typology.Vulcanic, { x: 30, y: 30 });
	let ss = stock.getState();
	ss.addKnowledge({ technology: ["LandingModule"] });
	stock.addBuilding("LandingModule", { x: 10, y: 10 });
	for(let t = 0; t < 4; t++) Turn.advance(stock);
	stock.addBuilding("Smelter", { x: 8, y: 10 }, true);
	ss.createMaterials({ metalOre: 100 });
	for(let t = 0; t < 5; t++) Turn.advance(stock);
	expect("scorta interna: la fonderia conserva 10 barre", ss.getStored("ironBar"), 10);
	stock.addBuilding("Depot", { x: 9, y: 13 }, true);
	for(let t = 0; t < 2; t++) Turn.advance(stock);
	expect("deposito: +5 barre", ss.getStored("ironBar"), 15);
	ss.destroyMaterials({ metalOre: ss.getStored("metalOre") });
	Turn.project(stock);
	expect("scorta interna anche con la fonderia ferma", [(ss.getInactiveList()["Smelter"] || []).length, ss.getCapacity("ironBar")], [1, 15]);

	// notifiche di sblocco: consegna del kit in una sola notifica, scoperte e nuovi studi
	let news = new TerrainMap(Typology.Vulcanic, { x: 30, y: 30 });
	let nw = news.getState();
	nw.addKnowledge({ technology: ["LandingModule"] });
	news.addBuilding("LandingModule", { x: 10, y: 10 });
	let newsEvents = [];
	for(let t = 0; t < 4; t++) newsEvents = newsEvents.concat(Turn.advance(news).events);
	let kit = newsEvents.filter(e => e.type == "KIT_DELIVERED");
	expect("kit consegnato: una sola notifica", [kit.length, kit.length ? kit[0].count > 10 : false, newsEvents.filter(e => e.type == "NEW_BUILDING").length], [1, true, 0]);
	nw.addKnowledge({ discovery: ["Resource_Mineral"] });
	let discovered = Turn.advance(news).events;
	expect("nessuna notifica per conoscenze aggiunte fuori dal turno", discovered.filter(e => e.type == "DISCOVERY").length, 0);
	nw.getResearchQueue().push(RecipeLib.create("Medicine"));
	news.addBuilding("AutoLab", { x: 12, y: 9 }, true);
	let studies = [];
	for(let t = 0; t < 10 && !studies.some(e => e.type == "NEW_STUDY"); t++) studies = studies.concat(Turn.advance(news).events);
	expect("nuovo studio dopo una ricerca completata", studies.filter(e => e.type == "NEW_STUDY").map(e => e.name).indexOf("Pharmacology") >= 0, true);
	expect("nuovo edificio dopo una ricerca completata", studies.filter(e => e.type == "NEW_BUILDING").map(e => e.name).indexOf("CryoCenter") >= 0, true);

	// Impianto a Microonde: consuma il satellite al piazzamento, al massimo 3 nella colonia
	let micro = new TerrainMap(Typology.Vulcanic, { x: 30, y: 30 });
	let ms = micro.getState();
	ms.addKnowledge({ technology: ["LandingModule"] });
	micro.addBuilding("LandingModule", { x: 10, y: 10 });
	for(let t = 0; t < 4; t++) Turn.advance(micro);
	let flat = [{ x: 12, y: 8 }, { x: 13, y: 8 }, { x: 13, y: 9 }, { x: 13, y: 10 }];
	flat.forEach(p => { while(micro.raze(p, TerrainLayer.Surface) > 0) {} });
	let tool = { buildingType: "MicrowavePlant" };
	expect("microonde: satellite del kit", [ms.getStored("MicrowaveSatellite"), reason(Placement.place(micro, tool, flat[0])), ms.getStored("MicrowaveSatellite")], [1, "ok", 0]);
	expect("microonde: senza satellite non si piazza", [reason(Placement.check(micro, tool, flat[1])), Placement.check(micro, tool, flat[1]).data.material], ["missingMaterial", "MicrowaveSatellite"]);
	ms.createMaterials({ MicrowaveSatellite: 5 });
	expect("microonde: massimo 3", [reason(Placement.place(micro, tool, flat[1])), reason(Placement.place(micro, tool, flat[2])), reason(Placement.check(micro, tool, flat[3]))], ["ok", "ok", "limitReached"]);
	for(let t = 0; t < 3; t++) Turn.advance(micro);
	expect("microonde: nessun satellite consumato dal cantiere", ms.getStored("MicrowaveSatellite"), 3);
	expect("satellite: costa barre di ferro", RecipeLib.get("MicrowaveSatellite").getCost().ironBar, 2);

	let idle = new TerrainMap(Typology.Vulcanic, { x: 30, y: 30 });
	idle.getState().addKnowledge({ technology: ["LandingModule"] });
	idle.addBuilding("LandingModule", { x: 10, y: 10 });
	for(let t = 0; t < 4; t++) Turn.advance(idle);
	idle.getState().destroyMaterials({ roboWorker: 100 });
	Turn.advance(idle);
	expect("sconfitta senza manodopera", idle.getState().getOutcome(), GameOutcome.Defeat);

	// nascite: un gruppo di 5 bambini ogni 2 turni a pieno personale, se cibo e alloggi bastano anche per loro
	let illnessRateNest = IllnessPhase.ILLNESS_RATE;
	IllnessPhase.ILLNESS_RATE = 0; // qui contano solo le nascite
	let nest = new TerrainMap(Typology.Vulcanic, { x: 30, y: 30 });
	let ns = nest.getState();
	ns.addKnowledge({ technology: ["LandingModule"] });
	ns.createMaterials({ foodUnit: 500, residentialUnit: 500, habitatUnit: 500 });
	nest.addBuilding("LandingModule", { x: 10, y: 10 });
	for(let t = 0; t < 4; t++) Turn.advance(nest);
	ns.getPopulation().registry.push(createWorkers(ns.getDate(), 2));
	let nursery = nest.addBuilding("Nursery", { x: 9, y: 13 }, true);
	let bornPerTurn = () => Turn.advance(nest).events.filter(e => e.type == "BIRTHS").map(e => e.count).reduce((a, b) => a + b, 0);
	let pattern = [];
	for(let t = 0; t < 4; t++) pattern.push(bornPerTurn());
	expect("nascite: 5 bambini ogni 2 turni", pattern, [0, 5, 0, 5]);
	expect("nascite: i bambini sono una nuova generazione", ns.getPopulation().registry.filter(g => g.getState(ns.getDate()) == "infants").reduce((n, g) => n + g.getPopulation(), 0), 10);
	ns.setBirthsSuspended(true);
	pattern = [];
	for(let t = 0; t < 3; t++) pattern.push(bornPerTurn());
	Turn.project(nest);
	expect("nascite sospese: asilo a riposo", [pattern, (ns.getActiveList()["Nursery"] || []).length, (ns.getInactiveList()["Nursery"] || []).length], [[0, 0, 0], 0, 0]);
	ns.setBirthsSuspended(false);
	Turn.advance(nest);
	ns.destroyMaterials({ foodUnit: ns.getStored("foodUnit") });
	ns.createMaterials({ foodUnit: 22 });
	expect("nascite: senza cibo per i nuovi nati non nasce nessuno", bornPerTurn(), 0);
	expect("nascite: avanzamento salvato", TerrainMap.fromData(JSON.parse(JSON.stringify(nest.toData()))).getState().getBirthProgress(), ns.getBirthProgress());
	IllnessPhase.ILLNESS_RATE = illnessRateNest;

	// malattia: con il Benessere a zero si ammalano i coloni nati, non i cloni; i malati non lavorano
	let ward = new TerrainMap(Typology.Vulcanic, { x: 30, y: 30 });
	let ws = ward.getState();
	ws.addKnowledge({ technology: ["LandingModule"] });
	ws.createMaterials({ foodUnit: 5000, residentialUnit: 5000, habitatUnit: 500 });
	ward.addBuilding("LandingModule", { x: 10, y: 10 });
	for(let t = 0; t < 4; t++) Turn.advance(ward);
	let healthyWorkers = createWorkers(ws.getDate(), 20);
	let wardClones = createClones(ws.getDate(), 4);
	ws.getPopulation().registry.push(healthyWorkers, wardClones);
	let fellIll = 0;
	for(let t = 0; t < 3; t++) fellIll += Turn.advance(ward).events.filter(e => e.type == "FELL_ILL").reduce((n, e) => n + e.count, 0);
	expect("malattia: senza cure mediche i coloni si ammalano, i cloni no", [fellIll > 0, healthyWorkers.getSick() > 0, wardClones.getSick()], [true, true, 0]);
	Turn.project(ward);
	let wardFactor = 0.5 + 0.5 * ws.getPopulation().happiness;
	expect("malattia: i malati non lavorano", ws.getStored("workerLabor"), Math.floor(healthyWorkers.getHealthy() * 4 * wardFactor) + wardClones.getPopulation());
	expect("malattia: malati salvati", TerrainMap.fromData(JSON.parse(JSON.stringify(ward.toData()))).getState().getPopulation().registry[0].getSick(), healthyWorkers.getSick());
	// cura: un Kit Medico per malato, nei limiti delle Strutture Mediche attive (1 cura la base)
	expect("cura: senza struttura medica", Cure.check(ward).reason, "noMedicalStructure");
	ward.addBuilding("MedicalStructure", { x: 9, y: 13 }, true);
	ws.createMaterials({ pharmaceuticalUnit: 1000 });
	Turn.project(ward);
	expect("cura: senza kit medici", Cure.check(ward).reason, "noMediKit");
	ws.createMaterials({ mediKit: 10 });
	Turn.project(ward);
	let cure = Cure.request(ward);
	expect("cura prenotata: una sola con una struttura base", [cure.ok, ws.getPendingCures(), Cure.check(ward).reason], [true, 1, "allScheduled"]);
	let sickBefore = Cure.sick(ws);
	Turn.advance(ward);
	expect("cura: consuma un kit medico", [ws.getStored("mediKit"), ws.getPendingCures()], [9, 0]);
	ws.setAutoCure(true);
	Turn.advance(ward);
	expect("cure automatiche: un altro kit", ws.getStored("mediKit"), 8);
	expect("strutture mediche: niente kit medici nei consumi", Object.keys(PrototypeLib.get("MedicalStructure").getConsumption()).indexOf("mediKit"), -1);

	// i cloni a fine vita lavorativa muoiono invece di andare in pensione
	let aging = new TerrainMap(Typology.Vulcanic, { x: 30, y: 30 });
	let ag = aging.getState();
	ag.addKnowledge({ technology: ["LandingModule"] });
	aging.addBuilding("LandingModule", { x: 10, y: 10 });
	for(let t = 0; t < 4; t++) Turn.advance(aging);
	ag.createMaterials({ foodUnit: 100 });
	let oldClones = createClones(ag.getDate() - 56, 1);
	let oldWorkers = createWorkers(ag.getDate() - 56, 1);
	let soonClones = createClones(ag.getDate() - 55, 1);
	ag.getPopulation().registry.push(oldClones, oldWorkers, soonClones);
	let expiry = Turn.advance(aging);
	expect("avviso: lotto di cloni in scadenza il turno prima", [expiry.events.filter(e => e.type == "CLONES_EXPIRING").map(e => e.count), soonClones.getPopulation() > 0], [[soonClones.getPopulation()], true]);
	expect("cloni a fine vita", [oldClones.getPopulation(), oldWorkers.getState(ag.getDate()), expiry.events.some(e => e.type == "CLONES_EXPIRED")], [0, "retirees", true]);
	expect("turno dopo una generazione estinta", (() => { try { Turn.advance(aging); return "ok"; } catch(e) { return String(e); } })(), "ok");
	let reloaded = TerrainMap.fromData(JSON.parse(JSON.stringify(aging.toData())));
	expect("salvataggio dei cloni", reloaded.getState().getPopulation().registry.map(g => g.isClone()), [true, false, true]);

	return failures;
}

(function()
{
	let out = document.getElementById("out");
	let result;
	try { result = JSON.stringify(scenario(), null, 1); }
	catch(e) { result = null; out.innerHTML = '<span class="ko">EXCEPTION ' + e.stack + '</span>'; window.__result = { error: String(e.stack) }; }

	// le verifiche girano dopo lo scenario, per non alterare la sequenza casuale
	let failures;
	try { failures = checks(); } catch(e) { failures = ["EXCEPTION " + e.stack]; }
	document.body.insertAdjacentHTML("beforeend", "<h3>Verifiche</h3><pre>" +
		(failures.length ? '<span class="ko">' + failures.join("\n") + "</span>" : '<span class="ok">tutte superate</span>') + "</pre>");
	window.__checks = failures;
	if(result === null) return;

	if(location.search.indexOf("reset=1") >= 0) localStorage.removeItem("outpost-baseline");
	let base = localStorage.getItem("outpost-baseline");
	if(base == null)
	{
		localStorage.setItem("outpost-baseline", result);
		out.innerHTML = '<span class="ok">baseline salvata</span>\n' + result;
		window.__result = { baseline: true };
		return;
	}
	let a = base.split("\n"), b = result.split("\n");
	let diffs = [];
	for(let i = 0; i < Math.max(a.length, b.length); i++) if(a[i] !== b[i]) diffs.push(i + ": " + a[i] + "  =>  " + b[i]);
	out.innerHTML = (diffs.length ? '<span class="ko">' + diffs.length + ' righe diverse</span>\n' + diffs.join("\n") : '<span class="ok">identico alla baseline</span>') + "\n\n" + result;
	window.__result = { diffs: diffs, alerts: window.__alerts || [] };
})();
</script>
</body>
